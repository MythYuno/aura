<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <!-- WCAG 2.1 SC 1.4.4 (Resize Text): permettiamo zoom utente fino a 5x per
       l'accessibilità degli ipovedenti. interactive-widget=resizes-content
       evita il bug della tastiera virtuale che sposta il viewport iOS. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, interactive-widget=resizes-content" />

  <!-- PWA / iOS Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AURA" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Theme color: le superfici di sistema, per il primo paint e per la
       cornice della PWA. La modalita segue il telefono. -->
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />

  <!-- Content-Security-Policy: difesa in profondità contro XSS, anche se
       React già escapa il rendering. 'unsafe-inline' su style serve a Tailwind
       compilato; img-src include data: per le icone inline svg.
       Nessuna origine esterna: nessun font importato, nessun backend. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' data: blob:;
    connect-src 'self';
    manifest-src 'self';
    base-uri 'self';
    form-action 'none';
    frame-ancestors 'none';
  " />

  <!-- SEO + social -->
  <meta name="description" content="AURA — Tracker finanze personali. Privacy-first, offline-first, zero cloud." />
  <meta property="og:title" content="AURA — Finanze personali" />
  <meta property="og:description" content="Tracker finanze personali. Zero cloud, totale privacy." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="./icon.svg" />
  <meta name="twitter:card" content="summary" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <!-- iOS richiede un PNG per l'icona home (ignora l'SVG). ?v= forza iOS a
       riscaricare l'icona, scavalcando la sua cache testarda. -->
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=9" />

  <!-- Nessun font importato: i tipi sono quelli di sistema (-apple-system),
       quindi su iPhone e SF Pro senza nessuna richiesta di rete. -->

  <!-- Guardia anti-lampo: la modalita segue il telefono, quindi anche il
       primo pixel prima che il JS parta. -->
  <style>
    html, body { background: #F2F2F7; color: rgba(0,0,0,0.96); margin: 0; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #000000; color: rgba(255,255,255,0.96); }
    }
  </style>

  <title>AURA — Finanze personali</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
